# Café com Deus Shine — landing pública
#
# Projeto estático, sem build: o Netlify só publica a pasta `public/` e
# roda a função em `netlify/functions/`. Não existe passo de compilação,
# então o deploy é imediato.

[build]
  publish = "public"
  functions = "netlify/functions"

# Cabeçalhos de segurança. A página não carrega script de terceiro nenhum
# além da fonte do Google, então a CSP pode ser fechada.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"

# Os assets têm nome fixo, então cache curto: se a logo for trocada, a
# visitante vê a nova no mesmo dia.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
